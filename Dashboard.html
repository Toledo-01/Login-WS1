<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
   <link rel="stylesheet" href="Dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- for my sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <img src="https://cdn.pixabay.com/photo/2025/05/24/12/40/whale-9619752_640.png" alt="Logo">
                <div class="user-info">
                    <h2>Maria</h2>
                    <span class="role">Student</span>
                </div>
            </div>
            
            <a href="#Home">Home</a>
            <a href="#Profile">Profile</a>
            <a href="#Settings">Settings</a>
            <a href="index.html" class="logout-link">Logout</a>
        </aside>

        
        <main class="main">
            <section class="profile-card">
                <img src="https://cdn.pixabay.com/photo/2025/05/24/12/40/whale-9619752_640.png" alt="Profile Picture">
                <h2>Welcome, Maria!</h2>
                <p><strong>Email:</strong> maria@example.com</p>
                <p><strong>Role:</strong> Student</p>
                <a href="#" class="edit-btn">Edit Profile</a>
            </section>
        </main>
    </div>
</body>
</html>
